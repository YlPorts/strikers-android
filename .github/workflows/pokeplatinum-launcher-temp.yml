name: Pokemon Platinum launcher temporary build

on:
  push:
    branches:
      - pokeplatinum-launcher-build-20260917

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile launcher
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          if (-not (Test-Path $csc)) { throw "C# compiler not found" }
          & $csc /nologo /optimize+ /target:exe /out:PokemonPlatinumPC.exe PokemonPlatinumLauncher.cs
          if ($LASTEXITCODE -ne 0) { throw "Launcher compilation failed" }

      - name: Verify launcher
        shell: powershell
        run: |
          if (-not (Test-Path "PokemonPlatinumPC.exe")) { throw "Launcher exe missing" }
          Get-Item "PokemonPlatinumPC.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload launcher
        uses: actions/upload-artifact@v6
        with:
          name: pokeplatinum-rom-launcher
          path: PokemonPlatinumPC.exe
          if-no-files-found: error
