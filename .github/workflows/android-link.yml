name: android-full-link

on:
  push:
    branches: [android-port]
    paths:
      - '.github/workflows/android-link.yml'
      - 'cmake/android/**'
      - 'smstrikers-port/**'
  workflow_dispatch:

concurrency:
  group: android-full-link-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.31.1'

jobs:
  full-native-link:
    name: libstrikers.so arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        shell: bash
        run: |
          sdkmanager --install \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            'platforms;android-36'

      - name: Configure full native Android link
        shell: bash
        run: |
          cmake -S cmake/android -B build-android-link -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26

      - name: Build libstrikers.so
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android-link --target strikers_android --parallel 2 2>&1 | tee android-link.log

      - name: Verify SDL entry point
        shell: bash
        run: |
          test -f build-android-link/libstrikers.so
          "$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -Ws build-android-link/libstrikers.so | tee strikers-symbols.txt
          grep -q 'SDL_main' strikers-symbols.txt

      - name: Upload full native library
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: strikers-android-arm64-native
          path: build-android-link/libstrikers.so
          if-no-files-found: error

      - name: Preserve full-link log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strikers-android-full-link-log
          path: android-link.log
          if-no-files-found: ignore
