name: android-native

on:
  push:
    branches: ['android-*']
    paths:
      - '.github/workflows/android-native.yml'
      - 'android/**'
      - 'cmake/android/**'
      - 'smstrikers-port/**'
  workflow_dispatch:

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.31.1'

jobs:
  app-shell:
    name: full native APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Instrument NIS trigger callbacks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('smstrikers-port/src/Game/Render/Nis.cpp')
          source = path.read_text()
          old = '''            if ((oldTime <= triggerFrame) && (newTime > triggerFrame))
                      {
                          mTriggers[i].Fire(*this);
                      }'''
          new = '''            if ((oldTime <= triggerFrame) && (newTime > triggerFrame))
                      {
                          OSReport("[nistrig] BEGIN nis=%s i=%d type=%d frame=%.1f norm=%.4f old=%.4f new=%.4f name=%s target=%s p1=%lu p2=%lu p3=%lu p4=%lu f1=%.3f\\n",
                                   mHeader != NULL ? mHeader->name : "(unknown)",
                                   i,
                                   (int)mTriggers[i].type,
                                   (double)mTriggers[i].frameNumber,
                                   (double)triggerFrame,
                                   (double)oldTime,
                                   (double)newTime,
                                   mTriggers[i].name != NULL ? mTriggers[i].name : "(null)",
                                   mTriggers[i].target != NULL ? mTriggers[i].target : "(null)",
                                   (unsigned long)mTriggers[i].params.param1,
                                   (unsigned long)mTriggers[i].params.param2,
                                   (unsigned long)mTriggers[i].params.param3,
                                   (unsigned long)mTriggers[i].params.param4,
                                   (double)mTriggers[i].params.float1);
                          mTriggers[i].Fire(*this);
                          OSReport("[nistrig] END nis=%s i=%d type=%d frame=%.1f name=%s target=%s\\n",
                                   mHeader != NULL ? mHeader->name : "(unknown)",
                                   i,
                                   (int)mTriggers[i].type,
                                   (double)mTriggers[i].frameNumber,
                                   mTriggers[i].name != NULL ? mTriggers[i].name : "(null)",
                                   mTriggers[i].target != NULL ? mTriggers[i].target : "(null)");
                      }'''
          if old not in source:
              raise SystemExit('UpdateTriggers patch target was not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build packages
        shell: bash
        run: |
          sdkmanager --install \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'platform-tools'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build release-optimised APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon -p android :app:assembleRelease --stacktrace 2>&1 | tee android-apk-build.log

      - name: Collect unstripped native libraries
        if: always()
        shell: bash
        run: |
          set -eu
          mkdir -p android-native-debug
          STRIKERS_SO="$(find android/app/.cxx -type f -path '*/arm64-v8a/*' -name 'libstrikers.so' -print -quit 2>/dev/null || true)"
          SDL_SO="$(find android/app/.cxx -type f -path '*/arm64-v8a/*' -name 'libSDL3.so' -print -quit 2>/dev/null || true)"
          if [ -n "$STRIKERS_SO" ]; then cp "$STRIKERS_SO" android-native-debug/libstrikers.so; fi
          if [ -n "$SDL_SO" ]; then cp "$SDL_SO" android-native-debug/libSDL3.so; fi
          ls -lh android-native-debug || true

      - name: Upload unstripped native libraries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strikers-android-unstripped-native
          path: android-native-debug/
          if-no-files-found: ignore

      - name: Preserve APK build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strikers-android-apk-build-log
          path: android-apk-build.log
          if-no-files-found: ignore

      - name: Upload optimised APK
        uses: actions/upload-artifact@v7
        with:
          name: strikers-android-full-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  arm64-scan:
    name: arm64-v8a native scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        shell: bash
        run: |
          sdkmanager --install \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            'platforms;android-36' \
            'platform-tools'

      - name: Configure native sources for Android
        working-directory: smstrikers-port
        shell: bash
        run: |
          cmake -S . -B build-android-scan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DSTRIKERS_AURORA=OFF \
            -DSTRIKERS_FFMPEG=OFF \
            -DSTRIKERS_ASAN=OFF

      - name: Compile every in-scope game source
        working-directory: smstrikers-port
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android-scan --target strikers_scan --parallel 2 2>&1 | tee native-scan.log

      - name: Preserve native scan log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strikers-android-native-scan-log
          path: smstrikers-port/native-scan.log
          if-no-files-found: ignore

      - name: Preserve compile database
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strikers-android-compile-db
          path: smstrikers-port/build-android-scan/compile_commands.json
          if-no-files-found: ignore
