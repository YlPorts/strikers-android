name: android-native

on:
  push:
    branches: [android-port]
    paths:
      - '.github/workflows/android-native.yml'
      - 'smstrikers-port/**'
  workflow_dispatch:

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-scan:
    name: arm64-v8a native scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        shell: bash
        run: |
          sdkmanager --install \
            'ndk;27.2.12479018' \
            'cmake;3.31.1' \
            'platforms;android-35' \
            'platform-tools'

      - name: Configure native sources for Android
        working-directory: smstrikers-port
        shell: bash
        run: |
          cmake -S . -B build-android-scan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DSTRIKERS_AURORA=OFF \
            -DSTRIKERS_FFMPEG=OFF \
            -DSTRIKERS_ASAN=OFF

      - name: Compile every in-scope game source
        working-directory: smstrikers-port
        shell: bash
        run: cmake --build build-android-scan --target strikers_scan --parallel 2

      - name: Preserve compile database
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strikers-android-compile-db
          path: smstrikers-port/build-android-scan/compile_commands.json
          if-no-files-found: ignore
